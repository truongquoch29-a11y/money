<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý giao dịch</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

.card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input,select{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#2ecc71;
color:white;
font-size:16px;
}

.item{
border-bottom:1px solid #eee;
padding:10px 0;
}

.delete{
background:#e74c3c;
margin-top:5px;
}

</style>
</head>

<body>

<h1>💼 Quản lý giao dịch</h1>

<div class="card">
<p>💰 Tổng vốn: <b id="tongVon">0</b></p>
<p>📈 Tổng lãi: <b id="tongLai">0</b></p>
</div>

<div class="card">
<h3>👥 Vốn & Lãi mỗi người</h3>
<div id="nguoiStats"></div>
</div>

<div class="card">
<h3>📊 Thống kê theo acc</h3>
<div id="accStats"></div>
</div>

<div class="card">

<input id="acc" placeholder="🔑 Mã acc">

<input id="von" type="number" placeholder="💰 Vốn">

<input id="lai" type="number" placeholder="📈 Lãi">

<select id="status">
<option value="chua">Chưa bay</option>
<option value="bay">Đã bay</option>
</select>

<button onclick="them()">➕ Thêm giao dịch</button>

</div>

<div class="card">
<h3>📜 Danh sách giao dịch</h3>
<div id="list"></div>
</div>

<script>

let transactions = JSON.parse(localStorage.getItem("data")) || []

function save(){
localStorage.setItem("data",JSON.stringify(transactions))
}

function them(){

let acc = document.getElementById("acc").value
let von = Number(document.getElementById("von").value)
let lai = Number(document.getElementById("lai").value)
let status = document.getElementById("status").value

let ngayBay = null

if(status === "bay"){
ngayBay = new Date().toLocaleString()
}

transactions.push({
acc,
von,
lai,
status,
ngayBay
})

save()
render()

}

function xoa(i){

transactions.splice(i,1)

save()
render()

}

function doiTrangThai(i){

if(transactions[i].status === "chua"){

transactions[i].status = "bay"
transactions[i].ngayBay = new Date().toLocaleString()

}

save()
render()

}

function render(){

let tongVon = 0
let tongLai = 0

let accStats = {}
let nguoiStats = {}

transactions.forEach(t=>{

tongVon += t.von

if(!accStats[t.acc]){
accStats[t.acc] = {von:0,lai:0}
}

accStats[t.acc].von += t.von

if(t.status === "bay"){
tongLai += t.lai
accStats[t.acc].lai += t.lai
}

if(!nguoiStats[t.acc]){
nguoiStats[t.acc] = {von:0,lai:0}
}

nguoiStats[t.acc].von += t.von

if(t.status === "bay"){
nguoiStats[t.acc].lai += t.lai
}

})

document.getElementById("tongVon").innerText = tongVon
document.getElementById("tongLai").innerText = tongLai


let htmlAcc = ""

for(let acc in accStats){

htmlAcc += `
<div class="item">
<b>Acc ${acc}</b><br>
💰 Vốn: ${accStats[acc].von}<br>
📈 Lãi: ${accStats[acc].lai}
</div>
`

}

document.getElementById("accStats").innerHTML = htmlAcc


let htmlNguoi = ""

for(let acc in nguoiStats){

htmlNguoi += `
<div class="item">
<b>${acc}</b><br>
💰 Vốn: ${nguoiStats[acc].von}<br>
📈 Lãi: ${nguoiStats[acc].lai}
</div>
`

}

document.getElementById("nguoiStats").innerHTML = htmlNguoi


let html = ""

transactions.forEach((t,i)=>{

html += `
<div class="item">

<b>Mã acc:</b> ${t.acc}<br>
💰 Vốn: ${t.von}<br>
📈 Lãi: ${t.lai}<br>
📊 Trạng thái: ${t.status === "bay" ? "✈️ Đã bay" : "⌛ Chưa bay"}<br>
📅 Ngày bay: ${t.ngayBay || "-"}

<button onclick="doiTrangThai(${i})">✈️ Đổi thành đã bay</button>
<button class="delete" onclick="xoa(${i})">🗑 Xoá</button>

</div>
`

})

document.getElementById("list").innerHTML = html

}

render()

</script>

</body>
</html>
