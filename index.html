<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quản lý giao dịch</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial;
background:#f4f6f8;
margin:0;
padding:15px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.card{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:15px;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

/* ===== Stats ===== */

.stat-card{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat-box{
background:#f8fafc;
padding:14px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:600;
}

.section-title{
font-weight:700;
font-size:18px;
margin-bottom:12px;
}

.person{
background:#f9fafb;
padding:12px;
border-radius:12px;
margin-bottom:10px;
}

.person-name{
font-weight:700;
margin-bottom:6px;
}

.stat-row{
display:flex;
justify-content:space-between;
padding:3px 0;
}

/* ===== Form ===== */

input,select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
width:100%;
padding:13px;
margin-top:12px;
border:none;
border-radius:10px;
background:#2ecc71;
color:white;
font-size:16px;
font-weight:bold;
}

.delete{
background:#e74c3c;
margin-top:6px;
}

.fly{
background:#3498db;
margin-top:6px;
}

.item{
border-bottom:1px solid #eee;
padding:10px 0;
}

</style>
</head>

<body>

<h1>💼 Quản lý giao dịch</h1>

<div class="card">

<div class="stat-card">

<div class="stat-box">
<span>💰 Tổng vốn</span>
<b id="tongVon">0</b>
</div>

<div class="stat-box">
<span>📈 Tổng lãi</span>
<b id="tongLai">0</b>
</div>

</div>

</div>

<div class="card">

<div class="section-title">👥 Vốn & Lãi mỗi người</div>

<div id="nguoiStats"></div>

</div>

<div class="card">

<div class="section-title">📊 Thống kê theo acc</div>

<div id="accStats"></div>

</div>

<div class="card">

<input id="acc" placeholder="🔑 Mã acc">

<input id="von" type="number" placeholder="💰 Vốn (vd: 200 = 200000)">

<input id="lai" type="number" placeholder="📈 Lãi (vd: 50 = 50000)">

<select id="status">
<option value="chua">⌛ Chưa bay</option>
<option value="bay">✈️ Đã bay</option>
</select>

<button onclick="them()">➕ Thêm giao dịch</button>

</div>

<div class="card">

<div class="section-title">📜 Danh sách giao dịch</div>

<div id="list"></div>

</div>

<script>

let transactions = JSON.parse(localStorage.getItem("data")) || []

function save(){
localStorage.setItem("data",JSON.stringify(transactions))
}

/* thêm 3 số 0 */
function convertMoney(num){
return Number(num) * 1000
}

function them(){

let acc=document.getElementById("acc").value.trim()
let von=convertMoney(document.getElementById("von").value)
let lai=convertMoney(document.getElementById("lai").value)
let status=document.getElementById("status").value

if(!acc){
alert("Vui lòng nhập mã acc")
return
}

/* check trùng acc */

if(transactions.some(t=>t.acc===acc)){
alert("⚠️ Mã acc đã tồn tại!")
return
}

let ngayBay=null

if(status==="bay"){
ngayBay=new Date().toLocaleString()
}

transactions.push({
acc,
von,
lai,
status,
ngayBay
})

save()
render()

document.getElementById("acc").value=""
document.getElementById("von").value=""
document.getElementById("lai").value=""

}

function xoa(i){

if(!confirm("Xoá giao dịch này?")) return

transactions.splice(i,1)

save()
render()

}

function doiTrangThai(i){

if(transactions[i].status==="chua"){

transactions[i].status="bay"
transactions[i].ngayBay=new Date().toLocaleString()

}

save()
render()

}

function render(){

let tongVon=0
let tongLai=0

let accStats={}
let nguoiStats={}

transactions.forEach(t=>{

tongVon+=t.von

if(!accStats[t.acc]){
accStats[t.acc]={von:0,lai:0}
}

accStats[t.acc].von+=t.von

if(t.status==="bay"){
tongLai+=t.lai
accStats[t.acc].lai+=t.lai
}

if(!nguoiStats[t.acc]){
nguoiStats[t.acc]={von:0,lai:0}
}

nguoiStats[t.acc].von+=t.von

if(t.status==="bay"){
nguoiStats[t.acc].lai+=t.lai
}

})

document.getElementById("tongVon").innerText=tongVon
document.getElementById("tongLai").innerText=tongLai

/* stats người */

let htmlNguoi=""

for(let acc in nguoiStats){

htmlNguoi+=`

<div class="person">

<div class="person-name">${acc}</div>

<div class="stat-row">
<span>💰 Vốn</span>
<span>${nguoiStats[acc].von}</span>
</div>

<div class="stat-row">
<span>📈 Lãi</span>
<span>${nguoiStats[acc].lai}</span>
</div>

</div>

`

}

document.getElementById("nguoiStats").innerHTML=htmlNguoi

/* stats acc */

let htmlAcc=""

for(let acc in accStats){

htmlAcc+=`

<div class="person">

<div class="person-name">Acc ${acc}</div>

<div class="stat-row">
<span>💰 Vốn</span>
<span>${accStats[acc].von}</span>
</div>

<div class="stat-row">
<span>📈 Lãi</span>
<span>${accStats[acc].lai}</span>
</div>

</div>

`

}

document.getElementById("accStats").innerHTML=htmlAcc

/* list */

let html=""

transactions.forEach((t,i)=>{

html+=`

<div class="item">

<b>Mã acc:</b> ${t.acc}<br>
💰 Vốn: ${t.von}<br>
📈 Lãi: ${t.lai}<br>
📊 Trạng thái: ${t.status==="bay"?"✈️ Đã bay":"⌛ Chưa bay"}<br>
📅 Ngày bay: ${t.ngayBay||"-"}

<button class="fly" onclick="doiTrangThai(${i})">✈️ Đổi thành đã bay</button>

<button class="delete" onclick="xoa(${i})">🗑 Xoá</button>

</div>

`

})

document.getElementById("list").innerHTML=html

}

render()

</script>

</body>
</html>
