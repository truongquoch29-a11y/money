<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Công cụ tính vốn và lãi</title>

<style>
body{
font-family: Arial;
background:#f5f5f5;
padding:20px;
}

table{
border-collapse: collapse;
width:100%;
background:white;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

input{
width:100px;
padding:5px;
}

button{
padding:8px 15px;
margin:10px 0;
cursor:pointer;
}

.total{
margin-top:20px;
font-size:18px;
}
</style>
</head>

<body>

<h2>Công cụ tính vốn / bán / lãi</h2>

<button onclick="addRow()">Thêm giao dịch</button>

<table id="table">
<tr>
<th>Acc</th>
<th>Giá vốn</th>
<th>Giá bán</th>
<th>Lãi</th>
<th>Lãi mỗi người</th>
</tr>
</table>

<div class="total">
<p>Tổng vốn: <span id="tongvon">0</span></p>
<p>Tổng bán: <span id="tongban">0</span></p>
<p>Tổng lãi: <span id="tonglai">0</span></p>
<p>Lãi mỗi người: <span id="laimoinguoi">0</span></p>
</div>

<script>

function addRow(){

let table=document.getElementById("table")

let row=table.insertRow()

row.innerHTML=`
<td><input></td>
<td><input type="number" oninput="tinh()"></td>
<td><input type="number" oninput="tinh()"></td>
<td class="lai">0</td>
<td class="chiadoi">0</td>
`

}

function tinh(){

let rows=document.querySelectorAll("#table tr")

let tongvon=0
let tongban=0
let tonglai=0

rows.forEach((r,i)=>{

if(i==0)return

let von=r.cells[1].children[0].value*1||0
let ban=r.cells[2].children[0].value*1||0

let lai=ban-von

r.cells[3].innerText=lai
r.cells[4].innerText=lai/2

tongvon+=von
tongban+=ban
tonglai+=lai

})

document.getElementById("tongvon").innerText=tongvon
document.getElementById("tongban").innerText=tongban
document.getElementById("tonglai").innerText=tonglai
document.getElementById("laimoinguoi").innerText=tonglai/2

}

</script>

</body>
</html>
